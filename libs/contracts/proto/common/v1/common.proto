syntax = "proto3";

package common.v1;

// Cursor pagination. limit is clamped server-side (default 50, max 100).
// Offset/full-scan is not an option here: inserting a row shifts pages.
message PageRequest {
  int32 limit = 1;
  string cursor = 2;
}

// Money is a single currency in this project, so there is no Money type: an amount
// is int64 in minor units (kopecks). 1234 = 12.34.
// NEVER float: rounding errors would desync line totals from the order total.

message Timestamp {
  int64 epoch_millis = 1;
}

message Empty {}
