syntax = "proto3";

package orders.v1;

import "common/v1/common.proto";

service OrdersService {
  rpc AddToCart (AddToCartRequest) returns (Order);
  rpc GetCart (GetCartRequest) returns (Order);
  rpc UpdateCartItem (UpdateCartItemRequest) returns (Order);
  rpc RemoveCartItem (RemoveCartItemRequest) returns (Order);

  rpc Checkout (CheckoutRequest) returns (Order);
  rpc Get (GetRequest) returns (Order);
  rpc List (ListRequest) returns (OrderList);
  rpc Cancel (CancelRequest) returns (Order);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_DRAFT = 1;
  ORDER_STATUS_PENDING_PAYMENT = 2;
  ORDER_STATUS_PAID = 3;
  ORDER_STATUS_CONFIRMED = 4;
  ORDER_STATUS_CANCELED = 5;
  ORDER_STATUS_FAILED = 6;
}

message OrderItem {
  string id = 1;
  string product_id = 2;
  string seller_id = 3;
  // Snapshot: product may be renamed or deleted after purchase.
  string product_name = 4;
  int32 quantity = 5;
  // 0 in DRAFT, price fixed at checkout.
  int64 price_minor = 6;
  common.v1.Timestamp created_at = 7;
}

message Order {
  string id = 1;
  string user_id = 2;
  OrderStatus status = 3;
  repeated OrderItem items = 4;
  int64 total_minor = 5; // 0 in DRAFT
  string failure_reason = 6;
  common.v1.Timestamp created_at = 7;
  common.v1.Timestamp updated_at = 8;
}

message OrderList {
  repeated Order items = 1;
  string next_cursor = 2;
}

message AddToCartRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message GetCartRequest {}

message UpdateCartItemRequest {
  string order_item_id = 1;
  int32 quantity = 2;
}

message RemoveCartItemRequest {
  string order_item_id = 1;
}

message CheckoutRequest {
  string idempotency_key = 1;
}

message GetRequest {
  string id = 1;
}

message ListRequest {
  common.v1.PageRequest page = 1;
  repeated OrderStatus statuses = 2;
}

message CancelRequest {
  string id = 1;
  string reason = 2;
}
