---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: marketplace
type: Opaque
stringData:
  postgres-password: "postgres"
  app-jwt-secret: "dev-only-not-a-secret"

  database-url-catalog: "postgres://catalog:catalog@postgres:5432/catalog"
  database-url-inventory: "postgres://inventory:inventory@postgres:5432/inventory"
  database-url-orders: "postgres://orders:orders@postgres:5432/orders"
  database-url-payments: "postgres://payments:payments@postgres:5432/payments"
  database-url-users: "postgres://users:users@postgres:5432/users"
  database-url-notification: "postgres://notification:notification@postgres:5432/notification"
