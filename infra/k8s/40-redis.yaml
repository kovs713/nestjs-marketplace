---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: marketplace }
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]

---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: marketplace }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata:
      labels: { app: redis, component: cache }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            [
              "--save",
              "",
              "--appendonly",
              "no",
              "--maxmemory",
              "256mb",
              "--maxmemory-policy",
              "allkeys-lru",
            ]
          ports: [{ name: redis, containerPort: 6379 }]
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 384Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 999 # redis uid in the alpine image
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
