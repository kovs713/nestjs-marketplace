---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: marketplace }
spec:
  selector: { app: kafka }
  ports: [{ name: internal, port: 9092, targetPort: internal }]

---
# Single broker (broker+controller in one process). Advertised listener points at
# the Service DNS: with one broker the Service always routes back to it.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: marketplace }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata:
      labels: { app: kafka, component: kafka }
    spec:
      # appuser in apache/kafka is uid 1000; without fsGroup the volume is root-owned
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - {
                name: KAFKA_CONTROLLER_QUORUM_VOTERS,
                value: "1@localhost:9094",
              }
            - {
                name: KAFKA_LISTENERS,
                value: "INTERNAL://:9092,CONTROLLER://:9094",
              }
            - {
                name: KAFKA_ADVERTISED_LISTENERS,
                value: "INTERNAL://kafka:9092",
              }
            - {
                name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP,
                value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT",
              }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            # Stable cluster id: a random one on restart rejects existing data
            - { name: KAFKA_CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "1" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - {
                name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR,
                value: "1",
              }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
          ports:
            - { name: internal, containerPort: 9092 }
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
          livenessProbe:
            exec:
              command:
                [
                  "sh",
                  "-c",
                  "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
                ]
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                [
                  "sh",
                  "-c",
                  "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
                ]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }

---
# Topics are created explicitly: replication.factor, partitions and min ISR are
# not defaults we want auto-creation to guess.
apiVersion: batch/v1
kind: Job
metadata: { name: kafka-init-topics, namespace: marketplace }
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app: kafka-init-topics }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:4.3.1
          env: [{ name: BOOTSTRAP, value: "kafka:9092" }]
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              bin=/opt/kafka/bin
              for t in product.events stock.events notification.events order.events; do
                "$bin/kafka-topics.sh" --bootstrap-server "$BOOTSTRAP" --create --if-not-exists \
                  --topic "$t" --partitions 12 --replication-factor 1 \
                  --config min.insync.replicas=1
              done
              "$bin/kafka-topics.sh" --bootstrap-server "$BOOTSTRAP" --list
