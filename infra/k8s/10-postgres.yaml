---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: marketplace }
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]

---
# One instance, six databases and roles. Apps keep private schemas via their own
# DATABASE_URL; this only trades server isolation for far fewer moving parts.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: marketplace }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres, component: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_DB, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom:
                {
                  secretKeyRef: { name: app-secrets, key: postgres-password },
                }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "postgres"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              {
                command:
                  [
                    "psql",
                    "-U",
                    "postgres",
                    "-d",
                    "postgres",
                    "-c",
                    "select 1",
                  ],
              }
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            # postgres-init is created from infra/docker/postgres/init.sql (see
            # README); scripts run only when PGDATA is empty
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
