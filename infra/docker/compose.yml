name: marketplace

# One image, service selected at runtime via SERVICE (see Dockerfile).
x-app: &app
  image: marketplace:dev
  restart: unless-stopped

x-migrate: &migrate
  image: marketplace:dev
  restart: "no"
  depends_on:
    postgres: { condition: service_healthy }
  command: ["sh", "infra/docker/migrate.sh"]

services:
  postgres:
    image: postgres:18-alpine
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Two listeners: INTERNAL for sibling containers, EXTERNAL for clients on
      # the host. A single advertised listener hands host clients the container
      # hostname, and every host connection then fails.
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-init-topics:
    image: apache/kafka:4.3.1
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        for topic in product.events stock.events notification.events order.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 12 --replication-factor 1 --config min.insync.replicas=1
        done

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # pgsty/silo: open-source fork; official minio/minio and minio/mc were removed
  # from Docker Hub/Quay (2025-10). Console on localhost:9001.
  minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # files lib writes objects with public-read ACL, so the bucket needs
  # anonymous download; mc ships inside the silo image.
  minio-init:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/marketplace &&
      mc anonymous set download local/marketplace
      "

  migrate-catalog:
    <<: *migrate
    environment:
      SERVICE: catalog-service
      DATABASE_URL: postgres://catalog:catalog@postgres:5432/catalog

  migrate-inventory:
    <<: *migrate
    environment:
      SERVICE: inventory-service
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory

  migrate-orders:
    <<: *migrate
    environment:
      SERVICE: orders-service
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders

  migrate-payments:
    <<: *migrate
    environment:
      SERVICE: payment-service
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments

  migrate-users:
    <<: *migrate
    environment:
      SERVICE: users-service
      DATABASE_URL: postgres://users:users@postgres:5432/users

  migrate-notification:
    <<: *migrate
    environment:
      SERVICE: notification-service
      DATABASE_URL: postgres://notification:notification@postgres:5432/notification

  api-gateway:
    <<: *app
    # Builds the shared marketplace:dev once; every other service runs it.
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      NODE_ENV: development
      SERVICE: api-gateway
      PORT: "3000"
      USERS_GRPC_URL: users-service:50051
      CATALOG_GRPC_URL: catalog-service:50051
      INVENTORY_GRPC_URL: inventory-service:50051
      ORDERS_GRPC_URL: orders-service:50051
      JWT_SECRET: dev-only-not-a-secret
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "30d"
    ports: ["3000:3000"]

  users-service:
    <<: *app
    depends_on:
      migrate-users: { condition: service_completed_successfully }
    environment:
      NODE_ENV: development
      SERVICE: users-service
      PORT: "3000"
      GRPC_PORT: "50051"
      DATABASE_URL: postgres://users:users@postgres:5432/users
      JWT_SECRET: dev-only-not-a-secret
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "30d"

  catalog-service:
    <<: *app
    depends_on:
      migrate-catalog: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      kafka-init-topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: development
      SERVICE: catalog-service
      PORT: "3000"
      GRPC_PORT: "50051"
      DATABASE_URL: postgres://catalog:catalog@postgres:5432/catalog
      KAFKA_BROKERS: kafka:19092
      REDIS_URL: redis://redis:6379

  inventory-service:
    <<: *app
    depends_on:
      migrate-inventory: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      kafka-init-topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: development
      SERVICE: inventory-service
      PORT: "3000"
      GRPC_PORT: "50051"
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory
      KAFKA_BROKERS: kafka:19092
      REDIS_URL: redis://redis:6379
      CATALOG_GRPC_URL: catalog-service:50051

  orders-service:
    <<: *app
    depends_on:
      migrate-orders: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      kafka-init-topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: development
      SERVICE: orders-service
      PORT: "3000"
      GRPC_PORT: "50051"
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders
      KAFKA_BROKERS: kafka:19092
      REDIS_URL: redis://redis:6379
      CATALOG_GRPC_URL: catalog-service:50051
      INVENTORY_GRPC_URL: inventory-service:50051
      PAYMENT_GRPC_URL: payment-service:50051

  payment-service:
    <<: *app
    depends_on:
      migrate-payments: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      kafka-init-topics: { condition: service_completed_successfully }
    environment:
      NODE_ENV: development
      SERVICE: payment-service
      PORT: "3000"
      GRPC_PORT: "50051"
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments
      KAFKA_BROKERS: kafka:19092

  notification-service:
    <<: *app
    depends_on:
      migrate-notification: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      kafka-init-topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: development
      SERVICE: notification-service
      PORT: "3000"
      DATABASE_URL: postgres://notification:notification@postgres:5432/notification
      KAFKA_BROKERS: kafka:19092
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-not-a-secret
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "30d"
    ports: ["3001:3000"]

volumes:
  postgres-data:
  kafka-data:
  minio-data:
